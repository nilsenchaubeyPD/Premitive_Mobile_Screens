<!doctype html>
<html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topin Pre-assessment Flow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --line:#DDE2EC; --line2:#C9D1E0;
  --ink:#1F2A44; --ink2:#2B3A5C; --muted:#5B6579; --faint:#8D96A8;
  --blue:#1F5EE6; --blue-s:#F1F6FE; --blue-m:#E6EEFD; --blue-b:#C2DAFF; --blue-t:#1943AA;
  --green:#2F6B49; --green-s:#E9F5E0; --green-b:#66B88C;
  --amber-s:#FFF5C8; --amber-b:#E49A52; --amber-t:#6B4A0F;
  --cyan-s:#CEEEF3; --cyan-b:#33B5D9;
  --red:#8E2A36; --red-s:#F8E8E8; --red-b:#E0A3A8;
  --btn:#1F5EE6; --btn-h:#1850C4; --btn-t:#FFFFFF; --dis:#E8ECF3; --dis-t:#98A2B5;
  --dot:rgba(12,22,56,.13); --scrim:rgba(12,22,56,.45);
  --shadow:none;
}
:root{color-scheme:light}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Inter',system-ui,sans-serif;letter-spacing:-.015em;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
a{color:var(--blue);font-weight:600;text-decoration:none}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--blue-b)}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ph{border-bottom:1.5px dotted var(--faint);white-space:nowrap}

/* header */
.hdr{height:64px;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding-inline:max(24px,env(safe-area-inset-left,0px)) max(24px,env(safe-area-inset-right,0px));position:sticky;top:0;z-index:30}
.logo{display:flex;align-items:center;gap:9px;font-family:'Inter',sans-serif;font-weight:600;font-size:20px;letter-spacing:-.03em;color:var(--ink)}
.logo svg{width:24px;height:28px}
.logo i{font-style:normal;background:linear-gradient(90deg,#F0408C,#FF7A3D);-webkit-background-clip:text;background-clip:text;color:transparent}
.hr{display:flex;align-items:center;gap:12px}
.namechip{height:36px;padding:0 14px;border-radius:999px;background:var(--line);display:flex;align-items:center;gap:8px;font-weight:700;font-size:13.5px}
.namechip .av{width:22px;height:22px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:11px}

/* buttons etc */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 22px;border-radius:8px;background:var(--btn);color:var(--btn-t);font-weight:700;font-size:15px;transition:background .15s,transform .1s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{background:var(--dis);color:var(--dis-t);cursor:not-allowed}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line2)}
.btn.sm{height:36px;padding:0 14px;font-size:13.5px}
.btn.lg{height:54px;font-size:16px;padding:0 36px}
.btn.full{width:100%}
.btn.busy:disabled{background:var(--btn);color:var(--btn-t);cursor:progress}
.btn.ok:disabled{background:var(--green-b);color:#0C1638;cursor:default}
.link{background:none;color:var(--blue);font-weight:700;padding:8px 4px;min-height:40px}
.spin{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;flex:none}
.btn.busy .spin{border-color:rgba(127,127,127,.35);border-top-color:currentColor}
@keyframes sp{to{transform:rotate(360deg)}}
.ck path{stroke-dasharray:26;stroke-dashoffset:26;animation:dr .45s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.fade{animation:fd .22s ease-out}
@keyframes fd{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.fade,.ck path,.spin,.meter i{animation:none!important}.ck path{stroke-dashoffset:0}}

/* stepper */
.steps{background:var(--surface);border-bottom:1px solid var(--line)}
.stepsin{max-width:960px;margin:0 auto;padding:16px 24px;display:flex;align-items:center;gap:10px}
.st{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--faint);white-space:nowrap}
.st i{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;font-style:normal;font-size:12px;color:var(--faint);background:var(--surface)}
.st.cur{color:var(--blue)}.st.cur i{background:var(--btn);border-color:var(--btn);color:var(--btn-t)}
.st.done{color:var(--green)}.st.done i{background:var(--green-b);border-color:var(--green-b);color:#0C1638}
.st.done i .ic,.st i .ic{width:14px;height:14px;stroke-width:3}
.st:not(.cur) .lb{display:none}
.sline{flex:1;height:2px;background:var(--line);min-width:8px;border-radius:2px}
.sline.done{background:var(--green-b)}

/* banners */
.ban{display:flex;gap:10px;align-items:center;justify-content:center;padding:12px 24px;font-size:14px;font-weight:700;border-bottom:1px solid transparent}
.b-warn{background:var(--amber-s);color:var(--amber-t);border-color:var(--amber-b)}
.b-bad{background:var(--red-s);color:var(--red);border-color:var(--red-b)}

/* layout */
main{position:relative}
main::before{display:none;content:"";position:absolute;inset:0 0 auto 0;height:360px;background-image:radial-gradient(circle,var(--dot) 1.1px,transparent 1.3px);background-size:22px 22px;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);pointer-events:none}
.col{position:relative;width:100%;max-width:960px;margin:0 auto;padding:36px 24px 140px}
.cwrap{max-width:500px;margin:0 auto}
.cwrap.w{max-width:600px}
.eyebrow{font-size:13.5px;font-weight:700;color:var(--blue);margin-bottom:8px}
h1.h1{font-size:32px;line-height:1.15;font-weight:600;margin-bottom:10px;outline:none!important;box-shadow:none!important}
.sub{font-size:16px;color:var(--muted);margin-bottom:26px;max-width:620px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:32px;box-shadow:none;margin-bottom:24px}
.card h2{font-size:20px;font-weight:600;margin-bottom:16px}
.ccard{padding:28px}

/* who + tiles + rows */
.who{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 18px;margin-bottom:16px;flex-wrap:wrap}
.ava{width:46px;height:46px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:'Inter';font-weight:600;font-size:15px;flex:none}
.whot{flex:1;min-width:200px}.whot b{display:block;font-size:15.5px}.whot span{font-size:13.5px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:24px;overflow:hidden;box-shadow:var(--shadow)}
.tile{padding:16px 20px;border-right:1px solid var(--line)}.tile:last-child{border-right:0}
.tile small{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:3px}
.tile b{font-family:'Inter';font-weight:800;font-size:16px}
.row{display:flex;gap:16px;align-items:flex-start;padding:16px 0}
.row+.row{border-top:1px solid var(--line)}.row:first-of-type{padding-top:0}.row:last-child{padding-bottom:0}
.ric{width:40px;height:40px;border-radius:50%;background:var(--blue-s);color:var(--blue);display:grid;place-items:center;flex:none}
.ric .ic{width:20px;height:20px}
.rt{font-weight:700;font-size:15.5px}.rd{font-size:14.5px;color:var(--muted)}
.rd .good{color:var(--green);font-weight:700}.rd .slow{color:var(--amber-t);font-weight:700}.rd .off{color:var(--red);font-weight:700}
.spd{display:flex;gap:18px;margin-top:6px;font-weight:700;font-size:14px}
.spd span{display:inline-flex;align-items:center;gap:6px}.spd .ic{color:var(--blue);width:16px;height:16px}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{background:var(--bg);font-size:12.5px;font-weight:700;color:var(--muted);text-align:left;padding:11px 20px;letter-spacing:.03em}
.tbl td{padding:16px 20px;border-top:1px solid var(--line);vertical-align:top}
.tbl td:first-child{width:210px;font-weight:700}
.chk{display:flex;gap:12px;align-items:flex-start;font-size:15.5px;font-weight:600;cursor:pointer}
.chk input{width:22px;height:22px;flex:none;accent-color:var(--blue);margin-top:1px}

/* card flows */
.egrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 14px;margin-bottom:6px}
.ex{position:relative;border:1px solid var(--line2);border-radius:10px;overflow:hidden;aspect-ratio:4/3;background:var(--line)}
.ex svg.pic{width:100%;height:100%;display:block}
.exb{position:absolute;right:7px;bottom:7px;width:22px;height:22px;border-radius:6px;background:#B4232C;display:grid;place-items:center;color:#fff}
.exb.ok{background:#2F7A52}.exb .ic{width:14px;height:14px;stroke-width:2.6}
.exc{font-size:13px;font-weight:600;color:var(--muted);text-align:center;margin-top:6px}
.camb{position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:linear-gradient(160deg,#1F355A,#0C1638 75%)}
.camb svg{position:absolute;inset:0;width:100%;height:100%}
.camtag{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:999px;background:rgba(12,22,56,.6);color:#fff;font-size:12px;font-weight:700}
.rec{width:7px;height:7px;border-radius:50%;background:#ff5a5f;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
.guide{fill:none;stroke:rgba(255,255,255,.6);stroke-width:2;stroke-dasharray:7 7}
.q{font-weight:700;text-align:center;margin-top:14px;font-size:16px}
.quote{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.quote small,.heard small{display:block;font-size:12.5px;color:var(--muted);font-weight:700;margin-bottom:4px}
.quote div{font-family:'Inter';font-size:19px;font-weight:600}
.meter{display:flex;align-items:flex-end;justify-content:center;gap:5px;height:56px;margin:18px 0}
.meter i{width:11px;background:var(--blue-b);border-radius:3px;animation:mt 1.1s ease-in-out infinite}
.meter i:nth-child(2n){animation-delay:.2s}.meter i:nth-child(3n){animation-delay:.45s}.meter i:nth-child(5n){animation-delay:.7s}
@keyframes mt{0%,100%{height:10px}50%{height:52px}}
.heard{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tr{font-size:16px;font-weight:600}.tr.empty{color:var(--faint);font-style:italic;font-weight:500}
.okline{display:flex;align-items:center;gap:6px;color:var(--green);font-size:14px;font-weight:700;margin-top:8px}
.fix{margin-top:16px;border-radius:12px;padding:14px 16px;font-size:14.5px;border:1px solid}
.fix.bad{background:var(--red-s);border-color:var(--red-b);color:var(--ink)}
.fix.warn{background:var(--amber-s);border-color:var(--amber-b)}
.fix b{color:var(--red)}
.fix.warn b{color:var(--amber-t)}
.tabs{display:inline-flex;background:var(--line);border-radius:10px;padding:4px;gap:4px;margin:10px 0}
.tabs button{border-radius:7px;padding:7px 13px;font-size:13px;font-weight:700;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--blue);box-shadow:0 1px 3px rgba(12,22,56,.15)}
.fix ol{margin:4px 0 0 20px}
.stuck{margin-top:10px;font-size:14px;color:var(--muted)}
.fl{display:block;font-size:13.5px;font-weight:600;color:var(--muted)}
.inp{display:block;width:100%;height:48px;margin-top:6px;padding:0 14px;border:1px solid var(--line2);border-radius:8px;background:var(--surface);color:var(--ink);font:500 15.5px 'Inter',sans-serif}
.inp:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-m)}
.ferr{color:var(--red);font-size:13.5px;font-weight:600;margin-top:8px}
.note-t{background:var(--blue-s);border:1px solid var(--blue-m);color:var(--blue);border-radius:8px;padding:10px 14px;font-size:14px;font-weight:600;margin:20px 0 14px}
.sec-h{font-size:13px;font-weight:700;color:var(--muted);margin:22px 0 8px;letter-spacing:.02em}
.ul{margin-left:20px;color:var(--ink);font-size:14.5px}.ul li{margin:6px 0}.ul b{font-weight:700}
.tip{position:fixed;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:7px 11px;border-radius:8px;z-index:95;pointer-events:none;white-space:nowrap}
.tip kbd{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:4px 0 18px}
.stat{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:10px;padding:14px}
.stat b{display:block;font-size:18px;font-weight:700;line-height:1.2}.stat small{color:var(--muted);font-size:13px;font-weight:600}
.srow{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-size:15.5px}
.srow .sx{flex:1;min-width:0}.srow .sx b{display:block;font-weight:600}.srow .sm{display:block;color:var(--muted);font-weight:500;font-size:14px}
.sn{width:28px;height:28px;border-radius:50%;background:var(--blue-s);color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:13px}
.rt2{font-weight:600;font-size:15.5px;align-self:center;color:var(--ink)}
.row{align-items:center}
.lead{width:44px;display:grid;place-items:center;flex:none}
.mini{display:flex;align-items:center;gap:10px;justify-content:center;margin:0 0 22px}
.mi{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--faint)}
.mi i{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;background:var(--surface)}
.mi.cur{color:var(--blue)}.mi.cur i{border-color:var(--blue);background:var(--blue-s);color:var(--blue)}
.mi.done{color:var(--green)}.mi.done i{background:var(--green);border-color:var(--green);color:#fff}
.mline{width:36px;height:2px;background:var(--line);border-radius:2px}.mline.done{background:var(--green-b)}
@media (max-width:560px){.mi span{display:none}.stat{flex-direction:column;align-items:flex-start;gap:8px;padding:12px}.stat b{font-size:16px}}
.demo{border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:var(--bg)}
.demo .dt{display:flex;background:var(--line)}.demo .dt span{flex:1;text-align:center;padding:9px 4px;font-size:13px;font-weight:700;color:var(--muted);animation:dtab 6s infinite}
.demo .dt span:nth-child(2){animation-delay:2s}.demo .dt span:nth-child(3){animation-delay:4s}
@keyframes dtab{0%,32%{background:var(--surface);color:var(--blue);box-shadow:inset 0 -2px var(--blue)}33%,100%{background:transparent;color:var(--muted);box-shadow:none}}
.demo .db{height:96px;display:flex;align-items:center;justify-content:center;gap:14px;position:relative}
.demo .db i{width:120px;height:64px;border-radius:8px;background:linear-gradient(160deg,#7ea0e6,#3a62c4);position:relative;animation:dsel 6s infinite}
@keyframes dsel{0%,60%{outline:0}70%,95%{outline:3px solid var(--blue);outline-offset:2px}100%{outline:0}}
.demo .db em{position:absolute;right:14px;bottom:10px;font-style:normal;font-size:12px;font-weight:700;background:var(--blue);color:#fff;border-radius:999px;padding:5px 14px;animation:dshare 6s infinite}
@keyframes dshare{0%,80%{transform:scale(1)}88%{transform:scale(1.12)}100%{transform:scale(1)}}
.demo .cap{font-size:12.5px;color:var(--muted);text-align:center;padding:8px;border-top:1px solid var(--line);font-weight:600}
.asm{display:flex;gap:14px;align-items:center;padding:18px 24px;background:var(--blue-s);border-bottom:1px solid var(--blue-m)}
.asm b{display:block;font-size:16.5px;font-weight:700}.asm span span{font-size:13.5px;color:var(--muted)}.asm>div{min-width:0}
.asm .ric{background:#fff}
.ro{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:#F6F8FB;color:var(--ink);font-size:15.5px;font-weight:600}
.ro .ic{color:var(--faint);width:16px;height:16px}
.ctarow{display:grid;grid-template-columns:3fr 7fr;gap:10px;margin-top:20px}
.btn.danger{background:#C8323A;color:#fff}
.ctarow .btn{width:100%;height:50px;margin:0!important}
.prog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:18px}
.pg-t{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;font-size:14px}.pg-t b{font-weight:700}.pg-t span{color:var(--muted);font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--green-b);border-radius:99px;transition:width .4s}
.tl{list-style:none;position:relative}
.tli{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}
.tli.cur{border:2px solid var(--blue);padding:13px 15px;background:var(--blue-s)}
.tli .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:700;font-size:14px;background:var(--line);color:var(--faint)}
.tli.cur .dot{background:var(--blue);color:#fff}.tli.done .dot{background:var(--green-b);color:#0C1638}.tli .dot .ic{width:16px;height:16px;stroke-width:2.4}
.tli .tx{flex:1;min-width:0}.tli .tx b{display:block;font-size:15.5px}.tli .tx span{font-size:13.5px;color:var(--muted)}
.tli.lock .tx b{color:var(--muted)}
.stats.sv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.stats.sv .stat{flex-direction:column;align-items:flex-start;gap:10px;padding:14px;min-width:0}.stats.sv .stat b{white-space:normal!important}.greet{margin-bottom:24px}.greet .hi{font-size:15px;color:var(--muted);margin:0 0 6px}.greet h1{font-size:30px;margin:0 0 14px;font-weight:700;letter-spacing:-.01em}.gm{display:flex;flex-wrap:wrap;gap:8px}.gm>span{display:inline-flex;gap:6px;align-items:center;font-size:13.5px;font-weight:500;color:var(--ink2);background:var(--blue-s);border:1px solid var(--blue-m);border-radius:999px;padding:6px 12px}.gm .ic{width:16px;height:16px;color:var(--blue)}.idc{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:12px}.av{width:48px;height:48px;border-radius:50%;background:var(--blue-m);color:var(--blue);font-weight:700;display:grid;place-items:center;font-size:18px;flex:none}.idc b{display:block;font-size:16px}.idc small{color:var(--muted);font-size:14px}.btn.dgo{background:#fff;color:#B42318;border:1px solid #F1C5C1}.btn.dgo:disabled,.btn.sec:disabled{background:var(--dis);color:var(--dis-t);border-color:transparent}
.asm2{display:flex;gap:14px;align-items:center;padding:18px 20px;background:var(--blue-s);border:1px solid var(--blue-m);border-radius:10px;margin-bottom:28px}
.asm2 small{display:block;font-size:12.5px;font-weight:700;color:var(--blue);margin-bottom:2px}.asm2 b{display:block;font-size:18px;font-weight:700}.asm2 span span{font-size:13.5px;color:var(--muted)}.asm2 .ric{background:#fff}.asm2>div{min-width:0}
.ro{background:#F6F8FB}
.shot{pointer-events:none;user-select:none;border:1px solid var(--line2);border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 18px 40px -18px rgba(12,22,56,.35);color:#1b1f2a}
.sh-h{padding:16px 18px 10px}.sh-h b{display:block;font-size:16px}.sh-h span{font-size:13px;color:#5b6270}
.sh-tabs{display:flex;border-bottom:1px solid #e3e6ec;padding:0 10px}.sh-tabs span{padding:10px 14px;font-size:13.5px;font-weight:600;color:#9aa1ad;border-bottom:3px solid transparent;margin-bottom:-1px}.sh-tabs .on{color:#1a56db;border-color:#1a56db}

  $$('[data-copylink]',app).forEach(b=>b.onclick=()=>toast('Link copied'));

  const ep=epoch;setTimeout(()=>{if(ep!==epoch)return;
    if(netAnim){$('[data-netside]',app).outerHTML=netSide(true);$('[data-netdesc]',app).innerHTML=netDesc()}

/* Code of conduct is the start screen: Continue starts the session (mirrors startTest) */
V.coc=()=>{
  const locked=!opened()&&!S.atRun,bad=!allOk(),st=S.startState;
  app.innerHTML=twoCol(`<h1 class="h1">Code of Conduct</h1>
  <div class="card g"><div class="grp3"><div class="gl">Please follow these</div>${rowC('users','No Help from Others','Do not get help from anyone in the room or online.')}${rowC('phone','No Extra Devices','Do not use phones, smartwatches, earphones, or notes during the assessment.')}${rowC('monitor','Stay in the Assessment','Do not switch tabs or leave the assessment window.')}${rowC('warn','No Cheating','Cheating may end your assessment and affect your eligibility for future assessments.')}${rowC('ai','Don’t Use AI Tools','Do not use AI tools to generate answers or solve assessment questions.')}</div>
   <div class="note2">${ic('info')}${S.mobile?'Tab switches and activity are monitored.':'Camera, screen and audio stay monitored during the assessment.'}</div></div>
   ${st==='failed'?`<div class="fix bad" role="alert" style="margin-top:16px">We couldn’t start your session. Your timer has not started. <button class="link" data-retry style="padding:0 0 0 4px;min-height:0">Try again</button><button class="link" data-help style="padding:0 0 0 12px;min-height:0">Get help</button></div>`:''}`);
  const left=()=>Math.max(0,Math.ceil((S.startAt-Date.now())/1000));
  const hintFor=()=>bad?`Fix the item that needs attention to continue.${S.mobile?'':' <button class="link" data-gofix style="padding:0;min-height:0">Go to review</button>'}`:locked?`Opens in <b data-opin>${fmtHMS(left())}</b>`:'';
  const en=()=>S.coc&&!locked&&!bad&&st!=='starting';
  const bindHint=()=>{const g=$('[data-gofix]',$('#foot'));if(g)g.onclick=()=>go(S.mobile?'rules':'review')};
  const f=footer({label:locked?`Opens at ${fmtT(S.startAt)}`:st==='starting'?'<span class="spin"></span>Starting…':'Continue',wide:1,enabled:en(),hint:hintFor(),
    check:{text:'I agree to follow the code of conduct.',on:!!S.coc,onChange:v=>{S.coc=v;f.upd(en(),hintFor());bindHint()}},onNext:start});
  bindHint();if(st==='starting')f.nx.classList.add('busy');
  $('[data-retry]',app)&&($('[data-retry]',app).onclick=start);
  $('[data-help]',app)&&($('[data-help]',app).onclick=openHelp);
  if(locked)gateIv=setInterval(()=>{if(left()<=0){render();return}const e=$('[data-opin]');if(e)e.textContent=fmtHMS(left())},1000);
  async function start(){
    if(S.atRun){next();return}
    if(S.startState==='starting'||!opened()||!allOk()||!S.coc||blocked())return;
    S.startState='starting';render();const ep=epoch;await sleep(1400);if(ep!==epoch)return;
    if(S.o.start==='fail'){consume('start');S.startState='failed';render();return}
    S.startState='idle';S.atRun=true;S.atLeft=totalSecs();next();
  }
};

/* ---------- camera ---------- */
function exTiles(){
  const I=(n,x,y,w,h,abs)=>`<img src="${A[n]}" alt="" width="${w}" height="${h}" style="left:${abs?x+'px':`calc(50% + ${x}px)`};top:${y}px;width:${w}px;height:${h}px">`;
  const T=(cls,label,ok,imgs)=>`<figure><div class="tile ${cls}">${imgs}<span class="bd ${ok?'ok':''}">${mi(ok?'check-badge':'x-close')}</span></div><figcaption>${label}</figcaption></figure>`;
  return `<div class="ex2" aria-label="Examples">${
    T('dark','Too dark',0,I('ex-dark-body',-51,79,100,102)+I('ex-dark-head',-21,35,40,40))}${
    T('','More than one person',0,I('ex-body-small',-91,89,70,102)+I('ex-head-small',-70,57,28,28)+I('ex-body',-11,79,100,102)+I('ex-head',19,35,40,40))}${
    T('','Face cut off',0,I('ex-body',-51,79,100,102,1)+I('ex-head',-21,35,40,40,1))}${
    T('','Clear and well lit',1,I('ex-ok-body',-51,79,100,102)+I('ex-head',-21,35,40,40))}</div>`;
}
function fitCam(){$$('.cam2').forEach(c=>{const st=c.firstElementChild;if(!st)return;const off=452+(document.querySelector('.vlist')?106:0),k=Math.max(.45,Math.min(1,(innerHeight-off)/360,c.clientWidth/512));c.style.height=Math.round(360*k)+'px';st.style.transform='scale('+k+')'})}
addEventListener('resize',fitCam);
function camView(v,o={}){
  const _w=0;
  const P=(n,x,y,w,h,abs)=>`<img src="${A[n]}" alt="" style="left:${abs?x+'px':`calc(50% + ${x}px)`};top:${y}px;width:${w}px;height:${h}px">`;
  let s='';
  if(v==='cut')s=P('cam-head',-30,40,98,98,1)+P('cam-body',-108,170,254,260,1);
  else{if(v==='multi')s=P('cam-head',150,120,70,70)+P('cam-body',95,230,180,190);
    s+=P('cam-head',-49,93,98,98)+P('cam-body',-127,222,254,260);if(o.guide)s+=P('face-guide',-82,40,164,204)}
  if(v==='dark')s+='<span class="dim"></span>';
  return `<div class="cam2" aria-hidden="true"><div class="camst">${s}${o.count?`<span class="cdn">${o.count}</span>`:''}${o.tag?'<span class="tag"><i></i>Camera on</span>':''}</div></div>`;
}
function fixBox(msg,warn,tabsFor){
  if(!msg)return '';
  const tabs=tabsFor?`<div class="tabs">${['chrome','safari','firefox'].map(k=>`<button data-tab="${k}" class="${S.tab===k?'on':''}">${{chrome:'Chrome / Edge',safari:'Safari',firefox:'Firefox'}[k]}</button>`).join('')}</div><ol>${TAB_STEPS[S.tab].map(t=>`<li>${t.replace('{x}',tabsFor).replace('{X}',tabsFor[0].toUpperCase()+tabsFor.slice(1))}</li>`).join('')}</ol>`:'';
  return `<div class="fix ${warn?'warn':'bad'}" role="status"><div>${msg}</div>${tabs}</div>`;
}
function setCta(btn,o){
  btn.disabled=!!o.dis;btn.className='btn big '+(o.cls||'');
  btn.innerHTML=(o.mi?mi(o.mi):'')+(o.icon?ic(o.icon):'')+(o.spin?'<span class="spin"></span>':'')+(o.check?`<svg class="ic ck" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M5 12l4 4 10-10" fill="none"/></svg>`:'')+o.label;
}
const ACTS=(sec='<button class="btn sec big" data-prev>Back</button>')=>`<div class="acts">${sec}<button data-cta></button></div>`;
const bhtml=b=>`<button class="btn big ${b.sec?'sec':''} ${b.cls||''}" ${b.dis?'disabled':''} data-${b.id}>${b.mi?mi(b.mi):''}${b.spin?'<span class="spin"></span>':''}${b.label}</button>`;
const brow=a=>`<div class="acts">${a.map(bhtml).join('')}</div>`;
const CAM_PERM={blocked:'CAM_BLOCKED',dismissed:'CAM_DISMISSED',notfound:'CAM_NONE',inuse:'CAM_INUSE',osblocked:'CAM_OS'};
const CKSVG='<svg class="ic ck" viewBox="0 0 24 24" style="stroke-width:2.6"><path d="M5 12l4 4 10-10" fill="none"/></svg>';
/* allow → waiting → (permission error) → photo (3-2-1) → review → verifying; returning candidates get a quick check */
V.cam=()=>{
  const ep=epoch;let mode=S.perm.cam?'ask':'req',fix=null,view='ok',dark=false,cd=3,perm=null,vs=null;
  /* one verify press runs all three checks in sequence */
  const VL=()=>{const en=S.enrolled;return [['Camera Check','Checking…','Working'],['Face Verification','Verifying…','Verified'],['Face Enrollment',en?'Finding your photo…':'Enrolling…',en?'Already enrolled':'Enrolled']]};
  const vlist=()=>`<ul class="vlist v2" role="status" aria-live="polite">${VL().map((x,k)=>{const st=vs[k];return `<li class="${st}"><span class="vi">${st==='run'?'<span class="spin dk"></span>':st==='done'?CKSVG:st==='fail'?mi('x-close'):k+1}</span><div><b>${x[0]}</b><small>${st==='done'?x[2]:st==='run'?x[1]:st==='fail'?'Didn’t pass':'Waiting'}</small></div></li>`}).join('')}</ul>`;
  app.innerHTML=`<div class="cwrap n">`+mini('cam')+`<div class="card dcard" id="cc"></div></div>`;
  const cc=$('#cc');
  const draw=()=>{
    const en=S.enrolled;
    const head=`<div class="chd"><h2>Check your camera</h2><p>Make sure your face is clear and well lit.</p></div>`;
    const stuck=S.camTries>=3&&(mode==='perm'||fix)?`<p class="stuck">Still not working? <button class="link" data-gethelp>Get help</button></p>`:'';
    let h='';
    if(mode==='req'||mode==='wait')h=permCard('cam')+brow([mode==='wait'?{id:'cta',label:'Waiting for your permission…',spin:1,cls:'busy',dis:1}:{id:'cta',label:'Request Permission'}]);
    else if(mode==='ask')h=`<div class="chd"><h2>Check your camera</h2><p>Make sure your face is clearly visible, well-lit, and alone in the frame.</p></div>`+exTiles()
      +brow([{id:'cta',label:'Okay, Got it'}]);
    else if(mode==='perm')h=fixBox(fix,false,perm==='blocked'?'camera':null)+stuck+brow([{id:'cta',label:'Try Again'}]);
    else{
      const live=mode==='live'||mode==='quick'||mode==='count',cap=mode==='captured'||(mode==='verifying'&&!en);
      h=head+camView(view,{guide:live&&!fix&&view!=='cut',tag:live||(mode==='verifying'&&en),count:mode==='count'?cd:0})
       +(vs?vlist():`<p class="ptxt">${cap?'Is your face, background is clear and easy to visible?':en?'Your face is already set up. Quick check.':'We’ll check your camera, verify your identity, and then enroll your face.'}</p>`)
       +(fix?fixBox(fix,false):dark&&mode!=='ok'?fixBox(MSG.CAM_DARK_NOTE,true):'')+stuck
       +(mode==='live'?brow([{id:'cta',label:fix?'Retake':'Capture'}])
        :mode==='count'?brow([{id:'cta',label:`Capturing in ${cd}…`,cls:'busy',dis:1}])
        :mode==='captured'?brow([{id:'retake',label:'No, Retake',sec:1},{id:'cta',label:'Yes, Verify'}])
        :mode==='quick'?brow([{id:'cta',label:fix?'Try Again':'Verify'}])
        :mode==='verifying'?brow([{id:'cta',label:'Verifying...',cls:'busy',dis:1}])
        :brow([{id:'cta',label:CKSVG+'Looks good',cls:'ok',dis:1}]));
    }
    cc.innerHTML=h;fitCam();
    const cta=$('[data-cta]',cc);if(cta)cta.onclick=act;
    const rt=$('[data-retake]',cc);if(rt)rt.onclick=()=>{mode='live';fix=null;view='ok';vs=null;draw()};
    const gh=$('[data-gethelp]',cc);if(gh)gh.onclick=openHelp;
    S.enter=['wait','count','verifying','ok'].includes(mode)?null:act;
    $$('[data-tab]',cc).forEach(t=>t.onclick=()=>{S.tab=t.dataset.tab;draw()});
  };
  async function act(){
    if(blocked())return;
    if(mode==='req'||(mode==='perm'&&!S.perm.cam)){
      fix=null;mode='wait';draw();
      return reqPerm('cam',ok=>{if(ep!==epoch)return;if(ok){mode='ask';draw()}else{perm='dismissed';fix=MSG.CAM_DISMISSED;mode='perm';S.camTries++;draw()}})}
    if(mode==='ask'||mode==='perm'){
      fix=null;
      const c=S.o.cam;
      if(CAM_PERM[c]){perm=c;fix=MSG[CAM_PERM[c]];mode='perm';S.camTries++;consume('cam');return draw()}
      dark=c==='dark';if(dark)consume('cam');
      mode=S.enrolled?'quick':'live';view='ok';return draw()}
    if(mode==='live'){
      fix=null;view='ok';mode='count';cd=3;draw();
      while(cd>1){await sleep(800);if(ep!==epoch)return;cd--;draw()}
      await sleep(800);if(ep!==epoch)return;mode='captured';return act()}
    if(mode==='captured'||mode==='quick'){
      const en=S.enrolled,fc=S.o.face,failAt=fc==='ok'?-1:(fc==='nomatch'||en)?1:0;
      mode='verifying';fix=null;view='ok';vs=['run','wait','wait'];draw();
      for(let i=0;i<3;i++){
        vs[i]='run';draw();await sleep(i===2&&en?500:900);if(ep!==epoch)return;
        if(i===failAt){vs[i]='fail';draw();await sleep(900);if(ep!==epoch)return;
          S.camTries++;consume('face');fix=MSG['FACE_'+fc];view=fc==='multiple'?'multi':fc==='none'?'cut':fc==='dark'?'dark':'ok';mode=en?'quick':'live';vs=null;return draw()}
        vs[i]='done';draw()}
      S.enrolled=true;S.camTries=0;S.ok.cam=true;mode='ok';if(S.banner===MSG.CAM_UNPLUGGED){S.banner=null;banners()}draw();
      await sleep(1300);if(ep!==epoch)return;next()}
  }
  draw();
};

/* ---------- microphone ---------- */
V.mic=()=>{
  const ep=epoch;let mode=S.perm.mic?'ready':'req',fix=null,warn=false,heard=null,stopped=false,playing=false,cd=6;
  app.innerHTML=`<div class="cwrap n">`+mini('mic')+`<div class="card dcard" id="mc"></div></div>`;
  const mc=$('#mc');
  const head=`<div class="chd"><h2>Check your microphone</h2><p>Say the sentence below when recording starts.</p></div>`;
  const pad=n=>String(Math.max(0,n)).padStart(2,'0');
  const opt=S.o.micMode==='optional';
  const bars=(on)=>`<div class="mwave ${on?'wv-on':''}" aria-hidden="true">${Array.from({length:31},(_,k)=>`<i style="--d:${(k*137%11)/10}s;--h:${10+Math.round(34*Math.abs(Math.sin(k*.62+1)))}px"></i>`).join('')}</div>`;
  const viz=(on)=>`<div class="mrec" ${on?'role="status" aria-label="Recording in progress"':''}>
        <span class="mcore">${mi('microphone-01')}</span>
        <div class="mtext"><span class="s1">Speak out loud</span><span class="s2">“I am ready to start the assessment”</span></div>
        ${bars(on)}</div>`;
  const draw=()=>{
    let h='';
    if(mode==='req'||mode==='wait')h=permCard('mic')+brow([mode==='wait'?{id:'cta',label:'Waiting for your permission…',spin:1,cls:'busy',dis:1}:{id:'cta',label:'Request Permission'}]);
    else if(mode==='blocked'||mode==='none')h=fixBox(fix,false,mode==='blocked'?'microphone':null)+brow([{id:'cta',label:'Try Again'}]);
    else if(mode==='ready'||mode==='rec')h=head+viz(mode==='rec')
      +(mode==='rec'?brow([{id:'cta',label:`Stop Recording...${pad(cd)}`,sec:1,cls:'fullw'}]):brow([{id:'cta',label:'Start Recording'}]));
    else h=head+`<div class="qbox hbox" role="status"><div style="flex:1;min-width:0"><small>What we heard:</small><div class="qt ${heard.empty?'empty':''}">${heard.t}</div></div>${heard.empty?'':`<button class="btn sec" data-play aria-label="${playing?'Stop playback':'Play recording'}">${playing?ic('stop'):mi('play')}${playing?'Stop':'Play'}</button>`}</div>`
      +(playing?`<div class="mplay" role="status" aria-label="Playing your recording">${bars(true)}</div>`:'')
      +(fix?fixBox(fix,warn):'')
      +(mode==='clear'?brow([{id:'again',label:'Test Again',sec:1,dis:playing},{id:'cta',label:'Continue',dis:playing}]):brow([{id:'again',label:'Test Again',cls:'fullw',dis:playing}]));
    if(opt&&mode!=='rec'&&mode!=='clear')h+=`<div class="skipr"><button class="link" data-skip>Skip for now</button></div>`;
    mc.innerHTML=h;
    const cta=$('[data-cta]',mc);if(cta)cta.onclick=act;
    const ag=$('[data-again]',mc);if(ag)ag.onclick=()=>{if(playing)return;mode='ready';fix=null;heard=null;draw()};
    const sk=$('[data-skip]',mc);if(sk)sk.onclick=()=>{S.ok.mic='skipped';next()};
    S.enter=act;
    const pl=$('[data-play]',mc);if(pl)pl.onclick=async()=>{if(playing){playing=false;return draw()}playing=true;draw();await sleep(2200);if(ep!==epoch||!playing)return;playing=false;draw()};
    $$('[data-tab]',mc).forEach(t=>t.onclick=()=>{S.tab=t.dataset.tab;draw()});
  };
  async function act(){
    if(blocked())return;
    if(mode==='rec'){stopped=true;return}
    if(playing&&(mode==='clear'||mode==='fail'))return;
    if(mode==='req'||(mode==='blocked'&&!S.perm.mic&&S.o.mic!=='blocked')){mode='wait';draw();return reqPerm('mic',ok=>{if(ep!==epoch)return;if(ok){mode='ready';act()}else{mode='blocked';fix=MSG.MIC_BLOCKED;warn=false;heard=null;draw()}})}
    if(mode==='wait')return;
    if(mode==='clear'){S.ok.mic=true;return next()}
    if(mode==='fail'){mode='ready';fix=null;heard=null;return draw()}
    const pm=S.o.mic==='blocked'||S.o.mic==='notfound';
    if((mode==='blocked'||mode==='none')&&!pm){mode='ready';fix=null;return draw()}
    if(pm){const b=S.o.mic==='blocked';mode=b?'blocked':'none';fix=b?MSG.MIC_BLOCKED:MSG.MIC_NONE;warn=false;heard=null;consume('mic');return draw()}
    mode='rec';fix=null;heard=null;stopped=false;playing=false;cd=6;draw();
    for(let t=0;t<60&&!stopped;t++){await sleep(100);if(ep!==epoch)return;if(t%10===9){cd--;const b=$('[data-cta]',mc);if(b&&!stopped)b.textContent=`Stop Recording...${pad(cd)}`}}
    const o=S.o.mic;
    if(o==='clear'){mode='clear';heard={t:'“I am ready to start the assessment.”'};fix=null}
    else if(o==='noisy'){mode='clear';heard={t:'“I am ready to start the assess…”'};fix=MSG.MIC_NOISY;warn=true;consume('mic')}
    else{mode='fail';heard={t:'Nothing heard',empty:true};fix=MSG.MIC_SILENT;warn=false;consume('mic')}
    draw();
  }
  draw();
};

/* Simulated browser permission prompt (Chrome style, top-left). Asked once per device; later steps reuse the answer. */

function liveView(){
  window.__startRefresh=null;app.classList.remove('wide');epoch++;S.enter=null;const s=SECS[S.sec];let secs=s.t*60;
  app.innerHTML=`<div class="live"><div class="lv-top"><div class="crumb">Full-Stack Developer Assessment ${ic('arrow')} <b>${s.n}</b></div><div class="pills"><span class="chip">${ic('camera')}Camera</span>${SCREEN_SHARE?`<span class="chip">${ic('monitor')}Screen shared</span>`:''}<span class="chip">${ic('mic')}Mic</span></div></div>
   <div class="lv-body"><div class="lq"><span class="chip" style="align-self:flex-start;background:var(--blue-m);color:var(--blue-t)">Question 1 of ${s.q}</span><h3>A train 150 m long passes a pole in 15 seconds. What is its speed?</h3><p>Convert the speed to km/h. Use 1 m/s = 3.6 km/h.</p></div>
   <div class="lo">${['36 km/h','45 km/h','54 km/h','60 km/h'].map((t,i)=>`<button class="opt"><i>${'ABCD'[i]}</i>${t}</button>`).join('')}</div></div>
   <div class="lv-bar"><div class="clock">${ic('clock')}<div><b data-t>00:00</b><span>Time left · auto-submits at zero</span></div></div><div style="display:flex;gap:10px"><button class="btn danger" data-finish>End section</button></div></div></div>`;
  $$('.opt',app).forEach(b=>b.onclick=()=>{$$('.opt',app).forEach(x=>x.classList.remove('on'));b.classList.add('on')});
  $('[data-finish]',app).onclick=openEndSection;
  const f=n=>String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');
  const tick=()=>{const e=$('[data-t]',app);if(e)e.textContent=f(secs);const e2=$('[data-t2]',app);if(e2)e2.textContent=f(secs);if(secs>0)secs--};tick();clearInterval(timerIv);timerIv=setInterval(tick,1000);
  window.scrollTo(0,0);
}

/* ---------- end assessment ---------- */
function dialog(title,body,cancel,ok,onOk,danger){
  const el=h(`<div class="modal-back"><div class="picker" style="width:min(440px,100%);font-family:inherit" role="dialog" aria-modal="true" aria-label="${title}"><div class="pk-h" style="display:block"><b style="font-size:18px">${title}</b><span style="display:block;margin-top:6px;font-size:14px">${body}</span></div><div class="pk-f">${cancel?`<button class="c" data-s>${cancel}</button>`:''}<button class="s" data-o ${danger?'style="background:#C8323A"':''}>${ok}</button></div></div></div>`);
  const close=()=>el.remove();
  if($('[data-s]',el))$('[data-s]',el).onclick=close;$('[data-o]',el).onclick=()=>{close();onOk()};
  el.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  document.body.appendChild(el);($('[data-s]',el)||$('[data-o]',el)).focus();
}
function openEndSection(){
  const s=SECS[S.sec];
  dialog(`End ${s.n}?`,'You can\u2019t return to this section. Unanswered questions get 0 marks.','Keep working','End section',()=>{if(!S.done.includes(S.sec))S.done.push(S.sec);go('sections');toast(`${s.n} submitted. Your answers are saved.`)},true);
}
function openEnd(){
  const c=secCtx(),left=c.tot-c.nd;
  const body=left?`${left} ${left===1?'section':'sections'} you haven\u2019t started will be submitted with no answers. You can\u2019t return.`:'All your sections are submitted. This finishes your assessment.';
  dialog('End Assessment?',body,'Cancel','End Assessment',()=>{S.atRun=false;footer(null);$('#steps').innerHTML='';$('#bans').innerHTML='';
    app.innerHTML=`<div class="gate"><div class="card"><h1 class="h1">Assessment submitted</h1><p class="sub">${c.nd} of ${c.tot} sections completed. You can close this window.</p></div></div>`},true);
}
/* ---------- logout ---------- */
function openLogout(){
  const el=h(`<div class="modal-back"><div class="picker" style="width:min(440px,100%);font-family:inherit" role="dialog" aria-label="Log out"><div class="pk-h" style="display:block"><b style="font-size:18px">Log out?</b><span style="display:block;margin-top:6px;font-size:14px">You can sign in again with the correct account using the same assessment link.</span></div><div class="pk-f"><button class="c" data-s>Stay signed in</button><button class="s" data-o>Log out</button></div></div></div>`);
  $('[data-s]',el).onclick=()=>el.remove();$('[data-o]',el).onclick=()=>{el.remove();toast('Logging out… taking you to the login page.')};
  document.body.appendChild(el);
}
/* ---------- session modals ---------- */
let sessIv=null;
function closeSess(){clearInterval(sessIv);$$('.sessback').forEach(e=>e.remove());document.body.classList.remove('sess-open')}
function openSigned(){
  closeSess();const first=S.name.trim().split(/\s+/)[0];let left=30;
  const el=h(`<div class="modal-back sessback"><div class="sdlg" role="alertdialog" aria-modal="true" aria-labelledby="sdt">
    <span class="sdi">${mi('sd-monitor')}</span>
    <h2 class="sdh" id="sdt">${first}, you’re signed in elsewhere</h2>
    <p>Your account just opened on another device. Use it here to continue, or log out to go back to the login page.</p>
    <span class="sdtm" role="timer" aria-label="Time left to choose">${mi('clock')}<b>00 : 30</b></span>
    <div class="sdf"><button class="btn big sec" data-lo>Logout</button><button class="btn big" data-use>Use Here</button></div></div></div>`);
  const tm=$('.sdtm',el),tb=$('b',tm);
  const out=()=>{closeSess();toast('Logging out… taking you to the login page.')};
  $('[data-use]',el).onclick=()=>{closeSess();toast('Continuing on this device')};
  $('[data-lo]',el).onclick=out;
  sessIv=setInterval(()=>{left--;tb.textContent='00 : '+String(Math.max(0,left)).padStart(2,'0');tm.classList.toggle('low',left<=10);if(left<=0)openExpired()},1000);
  document.body.classList.add('sess-open');document.body.appendChild(el);$('[data-use]',el).focus();
}
function openExpired(){
  closeSess();
  const el=h(`<div class="modal-back sessback"><div class="sdlg" role="alertdialog" aria-modal="true" aria-labelledby="sxt">
    <span class="sdi">${mi('sd-clock')}</span>
    <h2 class="sdh" id="sxt">Session Expired</h2>
    <p>Your session has expired. Please reload the window to continue.</p>
    <div class="sdf"><button class="btn big" data-rl>Reload</button></div></div></div>`);
  $('[data-rl]',el).onclick=()=>{closeSess();restart()};
  document.body.classList.add('sess-open');document.body.appendChild(el);$('[data-rl]',el).focus();
}
/* Report a problem lives in its own flow: the Report button and every Get help link only hand off to it */
function openHelp(){toast('Opens the Report a problem flow')}
$('#help-btn').onclick=openHelp;

/* ---------- enter hint: first hover only ---------- */
let hinted=false;const tip=h('<div class="tip" hidden>Press <kbd>Enter ↵</kbd></div>');document.body.appendChild(tip);
document.addEventListener('mouseover',e=>{const b=e.target.closest&&e.target.closest('[data-next],[data-cta]');if(!b||b.disabled||hinted||!matchMedia('(hover:hover)').matches)return;hinted=true;const r=b.getBoundingClientRect();tip.style.left=r.left+r.width/2+'px';tip.style.top=(r.top-40)+'px';tip.hidden=false;setTimeout(()=>tip.hidden=true,2200)});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('[data-next],[data-cta]'))tip.hidden=true});
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-prev]'))prev()});
/* ---------- keyboard ---------- */
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.defaultPrevented)return;
  if(document.querySelector('.drawer,.modal-back'))return;
  const t=e.target;if(t&&(t.tagName==='BUTTON'||t.tagName==='A'||t.tagName==='SELECT'))return;
  if(S.enter){e.preventDefault();S.enter()}
});

/* ---------- prototype controls ---------- */
const PRESETS={happy:['Happy path',{}],first:['First-timer with problems',{cam:'blocked',scr:'tab',failOnce:true}],fail:['Everything fails once',{cam:'inuse',mic:'silent',face:'none',scr:'window',ext:'blocked',start:'fail',failOnce:true}],early:['Early link',{link:'early'}],phone:['Phone on proctored',{device:'iphone'}],seb:['Safe Exam Browser',{type:'seb'}]};
const RESTART=['type','link','device','photo','consent','perms','micMode','bver','earlySetup','load','seb'];
function buildControls(){
  const o=S.o;
  const sel=(id,label,opts,val)=>`<label>${label}<select data-c="${id}">${opts.map(x=>`<option value="${x[0]}" ${x[0]===(val??o[id])?'selected':''}>${x[1]}</option>`).join('')}</select></label>`;
  $('#pcp').innerHTML=
   `<div class="pcl">Presets</div><div class="pcg">${Object.keys(PRESETS).map(k=>`<button data-p="${k}">${PRESETS[k][0]}</button>`).join('')}</div>`+
   `<label class="pck"><input type="checkbox" data-fo ${o.failOnce?'checked':''}>Fail once, then succeed</label>`+
   `<div class="pcl">Break it now</div><div class="pcg">${SCREEN_SHARE?'<button class="dk" data-b="screen">Stop screen sharing</button>':''}<button class="dk" data-b="cam">Unplug camera</button><button class="dk" data-b="offline">Go offline</button><button class="dk" data-b="signed">Signed in elsewhere</button><button class="dk" data-b="expired">Session expired</button><button data-b="clock">Advance clock to start</button><button data-b="reset">Reset</button></div>`+
   `<div class="pcl">Assessment</div>`+
   sel('type','Assessment type',[['proctored','Proctored'],['seb','Safe Exam Browser'],['non_proctored','Non-proctored (MCQ only)']])+
   sel('link','Link state',[['valid','Valid, open'],['early','Early (before start)'],['late','Late'],['resume','Resume (assessment running)'],['closed','Closed'],['submitted','Already submitted'],['invalid','Invalid link'],['error','Server error']])+
   sel('device','Device',[['win_chrome','Windows, Chrome'],['mac_chrome','Mac, Chrome'],['mac_safari','Mac, Safari'],['iphone','iPhone'],['android_tablet','Android tablet']])+
   sel('photo','Candidate',[['first','First time (take photo)'],['returning','Returning (quick check)']])+
   `<div class="pcl">Checks</div>`+
   sel('net','Network',[['good','Excellent'],['slow','Slow (6 Mbps)'],['tooslow','Too slow (under 5 Mbps)'],['offline','Offline']],S.net)+
   sel('ext','Browser extensions',[['clear','None found'],['blocked','Blocked extension found']])+
   sel('disp','Displays',[['one','One screen'],['multi','Extra monitor detected']])+
   sel('browser','Browser',[['auto','Auto-detect (this browser)'],['chrome','Google Chrome'],['edge','Microsoft Edge'],['brave','Brave'],['opera','Opera'],['operamini','Opera Mini'],['firefox','Firefox'],['safari','Safari']])+
   sel('perms','Permissions',[['first','First attempt (ask)'],['granted','Already granted (skip card)']])+
   sel('cam','Camera',[['ok','OK'],['dark','Too dark (warning, passes)'],['blocked','Blocked'],['dismissed','Prompt dismissed'],['notfound','No camera found'],['inuse','In use by another app'],['osblocked','Blocked by the OS']])+
   sel('face','Face check',[['ok','OK'],['none','No face'],['multiple','More than one person'],['covered','Face covered'],['far','Too far'],['close','Too close'],['dark','Face too dark'],['nomatch','Not recognised']])+
   sel('mic','Microphone',[['clear','Clear'],['noisy','Noisy (warning, passes)'],['silent','Silent'],['blocked','Blocked'],['notfound','No microphone found']])+
   (SCREEN_SHARE?sel('scr','Screen sharing',[['ok','Works'],['cancelled','Picker cancelled'],['tab','Shared a tab'],['window','Shared a window'],['multi','Second screen found'],['osblocked','Blocked by the OS']]):'')+
   sel('start','Start (Code of Conduct)',[['ok','Works'],['fail','Fails']])+
   sel('sv','Sections design',[['a','A · Cards'],['b','B · Timeline'],['c','C · Compact table'],['d','D · Tiles']],o.sv||'b')+
   `<div class="pcl">More</div>`+
   sel('consent','Consent',[['new','Not given yet'],['already','Already agreed']])+
   sel('micMode','Microphone mode',[['required','Required'],['optional','Optional (can skip)']])+
   sel('bver','Browser version',[['default','Up to date'],['outdated','Outdated']])+
   sel('earlySetup','Early setup',[['allowed','Allowed'],['locked','Locked until start']])+
   sel('seb','SEB launch',[['works','Works'],['blocked','Blocked by browser']])+
   sel('load','Link load',[['normal','Normal'],['slow','Slow (12 s)']]);
  const pcp=$('#pcp');
  $$('[data-c]',pcp).forEach(s=>s.onchange=()=>{
    const k=s.dataset.c,v=s.value;
    if(k==='net'){S.net=v;if(S.step==='rules'&&!gateKind())render();else{banners();if(['review','coc','sections'].includes(S.step)&&!gateKind())render()}return}
    S.o[k]=v;
    if(RESTART.includes(k))return restart();
    if(['browser','ext','disp'].includes(k)&&S.step==='rules'&&!gateKind())render();
    if(k==='sv'&&S.step==='sections'&&!document.querySelector('.live'))render();
  });
  $('[data-fo]',pcp).onchange=e=>{S.o.failOnce=e.target.checked};
  $$('[data-p]',pcp).forEach(b=>b.onclick=()=>{const p=PRESETS[b.dataset.p][1];S.o={...O0(),...p};S.net=b.dataset.p==='fail'?'slow':'good';restart()});
  $$('[data-b]',pcp).forEach(b=>b.onclick=()=>{
    const k=b.dataset.b,live=!!document.querySelector('.live');
    if(k==='reset')return reset();
    if(k==='clock'){S.startAt=Date.now();return render()}
    if(k==='signed')return openSigned();
    if(k==='expired')return openExpired();
    if(k==='offline'){S.net='offline';buildControls();if(['rules','review','coc'].includes(S.step)&&!live&&!gateKind())render();else banners();return}
    if(k==='screen'){if(!ids().includes('screen')||!S.ok.screen)return toast('Screen sharing isn’t running yet');S.ok.screen=false;S.banner=MSG.SCREEN_STOPPED}
    if(k==='cam'){if(!ids().includes('cam')||!S.ok.cam)return toast('Camera isn’t running yet');S.ok.cam=false;S.banner=MSG.CAM_UNPLUGGED}
    if(['review','coc','sections'].includes(S.step)&&!live)render();else banners();
  });
}
function reset(){S.o=O0();S.net='good';restart()}
$('#pcb').onclick=()=>{const p=$('#pcp'),o=p.hidden;p.hidden=!o;$('#pcb').setAttribute('aria-expanded',o)};
restart();
</script>
